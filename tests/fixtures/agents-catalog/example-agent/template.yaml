slug: example-agent
version: 1.0.0
displayName: Example Agent
description: Reviews items from a source and posts a summary to Slack.
avatar: PLACEHOLDER
category: testing

config:
  harness: claude
  model: sonnet
  effort: null
  ambientReplies: false
  schedules:
    - kind: schedule
      cron: ["0 13 * * 1-5"]

connectors:
  - slug: slack
    required: true
    account: agent
    tools: [post_message]
    reason: Posts the run summary.

setup:
  - name: admins
    label: Admins
    description: People who can change Setup.
    type: slack_user_list
    required: true
  - name: run_channel
    label: Run channel
    type: slack_channel
    required: true
  - name: max_items
    label: Max items per run
    type: integer
    required: true
    defaultValue: 5
    validation: { min: 1, max: 50 }
  - name: mode
    label: Mode
    type: enum
    required: true
    options: [review, draft]
    defaultValue: review
  - name: source_url
    label: Source URL
    type: url
    required: true
    placeholder: https://yourorg.example.com

files:
  agentsMd: AGENTS.md
  seed: [seed/knowledge.md, seed/reviews.csv]
installGuide: INSTALL.md
