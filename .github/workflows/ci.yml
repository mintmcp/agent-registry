name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # On PRs, group by ref so a new push to the same branch cancels the old run.
  # On push to main, use the unique run id so main builds never cancel each
  # other (a cancelled main run would leave the required-status badge red).
  group: ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, validate, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run validate

      - run: npm run test

      - run: npm run build
